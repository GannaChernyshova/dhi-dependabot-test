name: DHI Customization Recreate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DHICTL_VERSION: v0.0.13
  DHI_NO_UPDATE_NOTIFIER: "1"
  # Repository variables: Settings > Secrets and variables > Actions > Variables
  DHI_ORG: ${{ vars.DHI_ORG }}
  OLD_ID: ${{ vars.DHI_CUSTOMIZATION_ID }}

jobs:
  recreate-customization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install dhictl
        run: |
          curl -fsSL "https://github.com/docker-hardened-images/dhictl/releases/download/${DHICTL_VERSION}/dhictl-linux-amd64" -o /usr/local/bin/dhictl
          chmod +x /usr/local/bin/dhictl

      # Deletes the current customization (if any) and creates it again.
      - name: Recreate customization
        id: create
        run: |
          : "${DHI_ORG:?Set the DHI_ORG repository variable}"
          if [ -n "$OLD_ID" ]; then
            dhictl customization delete --org "$DHI_ORG" "$OLD_ID" --force \
              || echo "Could not delete $OLD_ID, continuing..."
          fi

          # Create from the rendered yaml, without the id line.
          envsubst '$DHI_ORG' < customization/customization.yaml \
            | sed '/^id:/d' > "$RUNNER_TEMP/customization.yaml"
          OUT=$(dhictl customization create --org "$DHI_ORG" "$RUNNER_TEMP/customization.yaml")
          echo "$OUT"

          # Output: Successfully created customization 'tools' (ID: cz_...)
          ID=$(echo "$OUT" | sed -n 's/.*(ID: \([^)]*\)).*/\1/p')
          if [ -z "$ID" ]; then
            echo "Error: could not read the customization ID from the create output"
            exit 1
          fi
          echo "Customization ID: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
        env:
          DHI_API_TOKEN: ${{ secrets.DHI_DOCKERHUB_TOKEN }}

      - name: Show next step
        run: |
          echo "### New customization ID: \`${{ steps.create.outputs.id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the DHI_CUSTOMIZATION_ID repository variable to this value." >> "$GITHUB_STEP_SUMMARY"
