name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: doi, tag: doi }
          - { dir: dhi, tag: dhi }
          - { dir: customization, tag: customized }
    steps:
      - uses: actions/checkout@v4

      # DHI images need an entitled Docker Hub account to pull.
      # Dependabot PRs only see Dependabot secrets, so add these under both
      # Settings > Secrets and variables > Actions and > Dependabot.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DHI_DOCKERHUB_USERNAME }}
          password: ${{ secrets.DHI_DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dir }}/Dockerfile
          push: false
          load: true
          tags: demo-node:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,scope=${{ matrix.tag }},mode=max

      - name: Smoke test
        run: docker run --rm demo-node:${{ matrix.tag }} node --version
