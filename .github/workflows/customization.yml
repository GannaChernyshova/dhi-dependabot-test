name: DHI Customization Edit

on:
  push:
    branches:
      - main
    paths:
      - customization/customization.yaml
  workflow_dispatch:

env:
  DHICTL_VERSION: v0.0.13
  DHI_ORG: demonstrationorg
  DHI_NO_UPDATE_NOTIFIER: "1"

jobs:
  update-customization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Show effective customization/customization.yaml
        run: cat customization/customization.yaml

      - name: Install dhictl
        run: |
          curl -fsSL "https://github.com/docker-hardened-images/dhictl/releases/download/${DHICTL_VERSION}/dhictl-linux-amd64" -o /usr/local/bin/dhictl
          chmod +x /usr/local/bin/dhictl

      # Uses the id in the yaml to pick the customization to update.
      - name: Update DHI customization
        run: dhictl customization edit --org "$DHI_ORG" customization/customization.yaml
        env:
          DHI_API_TOKEN: ${{ secrets.DHI_DOCKERHUB_TOKEN }}
